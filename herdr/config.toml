onboarding = false

[ui]
agent_panel_sort = "spaces"
prompt_new_workspace_name = true

# Agent panel, one line per agent: state dot, area (root folder, from the
# sidebar plugin's areas.json), glyphs (machine + agent), then the title the
# agent sets itself. The plugin also sorts agents by area, then priority.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$area", dim = true }, "agent", "terminal_title_stripped"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", { token = "$ticket", bold = true }],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true
