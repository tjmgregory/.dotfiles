onboarding = false

[ui]
agent_panel_sort = "spaces"
prompt_new_workspace_name = true

# Agent panel, one line per agent: state dot, glyphs (machine + agent, set by
# the agent-icons plugin), then the title the agent sets itself. The ticket
# token lives on the Space row instead.
[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "terminal_title_stripped"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", { token = "$ticket", bold = true }],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true
