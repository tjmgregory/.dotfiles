onboarding = false

[ui]
agent_panel_sort = "spaces"
prompt_new_workspace_name = true

# Agent panel, two lines per agent. Line one: state dot, area (root folder, from the
# sidebar plugin's areas.json), glyphs (machine + agent), then the title the
# agent sets itself, with the Linear ticket (if claimed) at the end of line one.
# prefix+t opens that ticket in the browser. The plugin also sorts agents by
# area, then priority.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$area", dim = true, rules = [
    { equals = "tse",      fg = "#F97316", dim = false },  # crafts.software icon orange
    { equals = "letsirl",  fg = "#899C5D", dim = false },  # Olive Colour System, olive ramp step 5
    { equals = "elephant", fg = "#266992", dim = false },  # primary-care-web MUI primary.light
  ] }, "agent", { token = "$ticket", bold = true }],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", { token = "$ticket", bold = true }],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "theo.sidebar.open-ticket"
description = "open Linear ticket for this pane"
