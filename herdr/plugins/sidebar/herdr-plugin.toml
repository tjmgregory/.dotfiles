id = "theo.sidebar"
name = "Sidebar"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Agent glyphs, area tokens from areas.json, and an Agents view grouped by area then priority"
platforms = ["macos", "linux"]

[[startup]]
command = ["bash", "sidebar.sh", "startup"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "sidebar.sh", "event"]

[[actions]]
id = "open-ticket"
title = "Open Linear ticket"
contexts = ["pane", "workspace", "global"]
command = ["bash", "open-ticket.sh"]
