id = "theo.sidebar"
name = "Sidebar"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Area tokens from areas.json, one-line agent rows coloured per area, Agents view grouped by area then priority, open-ticket action"
platforms = ["macos", "linux"]

[[startup]]
command = ["bash", "sidebar.sh", "startup"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "sidebar.sh", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "sidebar.sh", "event"]

[[events]]
on = "workspace.renamed"
command = ["bash", "sidebar.sh", "event"]

[[actions]]
id = "open-ticket"
title = "Open Linear ticket"
contexts = ["pane", "workspace", "global"]
command = ["bash", "open-ticket.sh"]
